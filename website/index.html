<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta
    name="description"
    content="Mihous — open tools for lighting, audio and video artists."
  />

  <meta name="theme-color" content="#090a0c" />

  <title>Mihous — Tools for creative control</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="./styles.css" />
</head>

<body>

<div class="app-shell">

  <header class="topbar">

    <a class="brand" href="#/" aria-label="Mihous home">
      <span class="brand-mark">
        <span></span>
        <span></span>
        <span></span>
      </span>

      <span>mihous</span>
    </a>

    <nav class="main-nav" aria-label="Main navigation">
      <a href="#/" data-nav="home">Home</a>
      <a href="#/docs" data-nav="docs">Documentation</a>
      <a href="#/code" data-nav="code">Code</a>
    </nav>

    <div class="topbar-actions">

      <a
        class="icon-btn"
        href="https://github.com/ligroku/mihous"
        target="_blank"
        rel="noreferrer"
        title="Open GitHub"
      >
        <span class="material-symbols-rounded">code</span>
      </a>

      <button
        class="icon-btn"
        id="themeBtn"
        title="Toggle theme"
        aria-label="Toggle theme"
      >
        <span class="material-symbols-rounded">
          dark_mode
        </span>
      </button>

    </div>

  </header>


  <main id="app"></main>


  <footer class="footer">

    <div>
      <strong>mihous</strong>
      — creative infrastructure for artists.
    </div>

    <div class="footer-links">
      <a
        href="https://github.com/ligroku/mihous"
        target="_blank"
        rel="noreferrer"
      >
        GitHub
      </a>

      <span>Apache-2.0</span>
    </div>

  </footer>

</div>


<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="./app.js"></script>

</body>
</html>
